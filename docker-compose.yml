services:

  postgres:
    image: postgres:16
    container_name: seat-reservation-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seat_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seat_reservation}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  app:
    image: seat-reservation:1.0
    container_name: seat-reservation-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seat_reservation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-3600000}

    ports:
      - "8080:8080"

    restart: unless-stopped


volumes:
  postgres_data: